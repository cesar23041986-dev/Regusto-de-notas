<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Registro de Notas — Instituto Nacional Gaspar García Laviana</title>
  <style>
    :root {
      --navy-950: #06102e;
      --navy-900: #0c1d5e;
      --navy-800: #152e8a;
      --green-700: #0b6623;
      --green-600: #12802e;
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-light: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #0c1d5e;
      --primary-hover: #172f8c;
      --danger: #b91c1c;
      --success: #0b6623;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(12, 29, 94, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 65%, var(--green-700) 140%);
      color: #ffffff;
      padding: 12px 16px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: #dbeafe;
    }

    .logo-img {
      object-fit: contain;
      border-radius: 8px;
      background: #ffffff;
      padding: 2px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
    }

    .logo-fallback-badge {
      border-radius: 8px;
      background: #ffffff;
      color: var(--navy-900);
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.28);
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      background: #4ade80;
    }

    .sync-dot.syncing { background: #facc15; }
    .sync-dot.offline { background: #94a3b8; }
    .sync-dot.error { background: #f87171; }

    .main-container {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }

    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 8px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .tab-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: var(--bg-subtle);
      color: var(--navy-900);
    }

    .tab-btn.active {
      background: var(--navy-900);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--navy-900);
    }

    .card-subtitle {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 960px) {
      .grid-3, .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .grid-2, .grid-3, .grid-4 {
        grid-template-columns: minmax(0, 1fr);
      }
      .main-container {
        padding: 10px;
      }
      .card {
        padding: 14px;
      }
      .btn-sm {
        padding: 7px 11px;
        font-size: 12px;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--navy-900);
    }

    .form-control, .select-sm, .input-sm {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus, .select-sm:focus, .input-sm:focus {
      outline: none;
      border-color: var(--navy-800);
      box-shadow: 0 0 0 3px rgba(12, 29, 94, 0.12);
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
    }

    .btn-primary {
      background: var(--navy-900);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--green-700);
      color: #ffffff;
    }

    .btn-success:hover {
      background: var(--green-600);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--navy-900);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover {
      background: var(--bg-subtle);
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: #991b1b;
    }

    .kpi-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }

    .kpi-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .kpi-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy-900);
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-navy {
      background: #e0e7ff;
      color: var(--navy-900);
    }

    .badge-green {
      background: #dcfce7;
      color: var(--green-700);
    }

    .badge-amber {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-red {
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      background: #ffffff;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      white-space: nowrap;
    }

    table.data-table th,
    table.data-table td {
      border: 1px solid var(--border-light);
      padding: 6px 8px;
      text-align: center;
      vertical-align: middle;
    }

    table.data-table th {
      background: var(--navy-900);
      color: #ffffff;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    table.data-table th.sub-th {
      background: #1e3a8a;
      font-size: 11px;
    }

    table.data-table th.qual-th {
      background: var(--green-700);
    }

    table.data-table td.left,
    table.data-table th.left {
      text-align: left;
    }

    table.data-table tbody tr:nth-child(even) {
      background: #f8fafc;
    }

    table.data-table tbody tr:hover {
      background: #eff6ff;
    }

    .grade-num-input {
      width: 58px;
      padding: 4px 5px;
      text-align: center;
      font-weight: 700;
      font-size: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
    }

    .grade-num-input:focus {
      outline: 2px solid var(--navy-800);
      border-color: var(--navy-800);
    }

    .grade-qual-select {
      padding: 4px 5px;
      font-weight: 700;
      font-size: 11.5px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: #ffffff;
    }

    .locked-cell {
      background: #f1f5f9 !important;
      color: #64748b;
    }

    .login-wrapper {
      max-width: 780px;
      margin: 12px auto;
    }

    .demo-panel {
      margin-top: 14px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
    }

    .demo-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-strong);
      font-size: 12.5px;
    }

    .demo-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .toast-container {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: calc(100vw - 32px);
    }

    .toast {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.2s ease;
    }

    .toast-success { background: var(--green-700); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--navy-900); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .muted-note {
      font-size: 12px;
      color: var(--text-muted);
    }

    .alert-box {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      margin-bottom: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script>
    /* ========================================================================
       CONFIGURACIÓN INSTITUCIONAL Y MALLA CURRICULAR (MINED NICARAGUA)
       ======================================================================== */
    const STORAGE_KEY = 'INGGL_SISTEMA_NOTAS_2026_V1';

    const GRADOS = ['7mo', '8vo', '9no', '10mo', '11mo'];
    const SECCIONES = ['A', 'B', 'C'];
    const TURNOS = ['Matutino', 'Vespertino'];

    const PERIODOS = [
      { id: 'corte1', label: 'I Corte Evaluativo', short: 'I Corte' },
      { id: 'corte2', label: 'II Corte Evaluativo', short: 'II Corte' },
      { id: 'semestral1', label: 'I Semestre (Prom.)', short: 'I Sem.' },
      { id: 'corte3', label: 'III Corte Evaluativo', short: 'III Corte' },
      { id: 'corte4', label: 'IV Corte Evaluativo', short: 'IV Corte' },
      { id: 'semestral2', label: 'II Semestre (Prom.)', short: 'II Sem.' },
      { id: 'anual', label: 'Promedio Anual', short: 'Anual' }
    ];

    const CUAN_7_9 = [
      { id: 'lengua', name: 'Lengua y Literatura', short: 'Lengua' },
      { id: 'ing', name: 'Lengua Extranjera (Inglés)', short: 'Inglés' },
      { id: 'mat', name: 'Matemática', short: 'Matemática' },
      { id: 'ccnn', name: 'Ciencias Naturales', short: 'CC.NN.' },
      { id: 'est_soc', name: 'Estudios Sociales', short: 'Est. Soc.' },
      { id: 'tac', name: 'Taller de Arte y Cultura (TAC)', short: 'TAC' }
    ];

    const CUAN_10_11 = [
      { id: 'lengua', name: 'Lengua y Literatura', short: 'Lengua' },
      { id: 'ing', name: 'Lengua Extranjera (Inglés)', short: 'Inglés' },
      { id: 'mat', name: 'Matemática', short: 'Matemática' },
      { id: 'fis', name: 'Física', short: 'Física' },
      { id: 'quim', name: 'Química', short: 'Química' },
      { id: 'bio', name: 'Biología', short: 'Biología' },
      { id: 'hist_geo', name: 'Historia y Geografía', short: 'Hist. y Geo.' },
      { id: 'filo', name: 'Filosofía', short: 'Filosofía' },
      { id: 'soci', name: 'Sociología', short: 'Sociología' },
      { id: 'econ', name: 'Economía', short: 'Economía' }
    ];

    const CUAL_SUBJECTS = [
      { id: 'crec', name: 'Crecimiento en Valores', short: 'Crec. Valores' },
      { id: 'ed_fis', name: 'Educación Física y Práctica Deportiva', short: 'Ed. Física' }
    ];

    const QUAL_OPTIONS = ['', 'AA', 'AS', 'AF', 'AI'];

    function getCurriculumForGrade(grade) {
      const isUpper = grade === '10mo' || grade === '11mo';
      const cuan = isUpper ? CUAN_10_11 : CUAN_7_9;
      return {
        cuan,
        cual: CUAL_SUBJECTS,
        all: [...cuan, ...CUAL_SUBJECTS]
      };
    }

    /* ========================================================================
       BASE DE DATOS INICIAL EN BLANCO (SIN ESTUDIANTES NI NOTAS PRECARGADAS)
       ======================================================================== */
    function buildInitialDatabase() {
      const sectionTurnos = {};
      GRADOS.forEach((g, idx) => {
        SECCIONES.forEach((sec, sIdx) => {
          sectionTurnos[`${g} ${sec}`] = (idx + sIdx) % 2 === 0 ? 'Matutino' : 'Vespertino';
        });
      });

      const users = [
        {
          id: 'u-dir',
          name: 'Dirección General',
          username: 'direccion',
          password: '123',
          role: 'admin',
          turno: 'Todos',
          guideSection: null,
          assignedSubjects: ['*']
        }
      ];

      return {
        schoolName: 'INSTITUTO NACIONAL "GASPAR GARCÍA LAVIANA"',
        schoolLocation: 'Tola, Rivas, Nicaragua — MINED',
        motto: 'SANDINO! Siempre Más Allá!',
        year: '2026',
        onlineConfig: {
          enabled: true,
          mode: 'rest',
          endpointUrl: '',
          apiKey: '',
          authToken: '',
          documentPath: 'inggl/2026/database',
          autoPullSeconds: 15
        },
        pendingSyncQueue: [],
        sectionTurnos,
        users,
        students: [],
        grades: {},
        customLogo: null,
        auditLog: [
          {
            id: 'log-init',
            time: new Date().toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit' }),
            actor: 'Sistema',
            action: 'Base de datos en blanco inicializada (Matutino y Vespertino)'
          }
        ]
      };
    }

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = buildInitialDatabase();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
          return fresh;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') {
          return buildInitialDatabase();
        }
        const defaults = buildInitialDatabase();
        if (!parsed.sectionTurnos) parsed.sectionTurnos = defaults.sectionTurnos;
        if (!Array.isArray(parsed.users) || parsed.users.length === 0) parsed.users = defaults.users;
        if (!Array.isArray(parsed.students)) parsed.students = [];
        if (!parsed.grades || typeof parsed.grades !== 'object') parsed.grades = {};
        if (!Array.isArray(parsed.auditLog)) parsed.auditLog = [];
        if (!Array.isArray(parsed.pendingSyncQueue)) parsed.pendingSyncQueue = [];
        parsed.onlineConfig = {
          ...defaults.onlineConfig,
          ...(parsed.onlineConfig && typeof parsed.onlineConfig === 'object' ? parsed.onlineConfig : {})
        };
        if (typeof parsed.customLogo !== 'string' || !parsed.customLogo.startsWith('data:image/')) {
          parsed.customLogo = null;
        }
        return parsed;
      } catch (err) {
        return buildInitialDatabase();
      }
    }

    let db = loadDatabase();

    const state = {
      currentUser: null,
      activeTab: 'registro',
      selectedSection: '7mo A',
      selectedPeriod: 'corte1',
      selectedTurnoFilter: 'Todos',
      selectedRendTurno: 'Matutino',
      selectedRendPeriod: 'corte1',
      studentSearch: '',
      loginError: '',
      syncStatus: navigator.onLine ? 'online' : 'offline',
      syncDetail: navigator.onLine ? 'ONLINE · Listo' : 'Sin señal · Cola activa',
      isSyncing: false,
      lastSyncedAt: '',
      lastSavedAt: new Date().toLocaleTimeString('es-NI', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      })
    };

    /* ========================================================================
       UTILIDADES, ESCUDO / LOGO Y NOTIFICACIONES
       ======================================================================== */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function notify(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.remove();
      }, 3200);
    }

    function renderSchoolLogo(size = 46) {
      if (db.customLogo && typeof db.customLogo === 'string' && db.customLogo.startsWith('data:image/')) {
        return `<img src="${db.customLogo}" alt="Logo Institucional" class="logo-img" style="width:${size}px;height:${size}px;" />`;
      }
      const fontSize = Math.max(10, Math.round(size * 0.25));
      return `<span class="logo-fallback-badge" style="width:${size}px;height:${size}px;font-size:${fontSize}px;">INGGL</span>`;
    }

    function handleLogoFileUpload(inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        notify('Seleccione un archivo de imagen válido (PNG, JPG, WEBP).', 'error');
        inputEl.value = '';
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        notify('La imagen supera los 2 MB. Elija una imagen más ligera.', 'error');
        inputEl.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        const dataUrl = ev.target && ev.target.result;
        if (typeof dataUrl === 'string' && dataUrl.startsWith('data:image/')) {
          db.customLogo = dataUrl;
          saveDatabase('Logo institucional actualizado', true);
          render();
        }
      };
      reader.onerror = function () {
        notify('Error al leer la imagen del logo.', 'error');
      };
      reader.readAsDataURL(file);
      inputEl.value = '';
    }

    function resetSchoolLogo() {
      db.customLogo = null;
      saveDatabase('Logo institucional restablecido al predeterminado', true);
      render();
    }

    function renderLogoManagerCard() {
      return `
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Logo Institucional del Centro</h3>
              <p class="card-subtitle">Sube o cambia el logo oficial que aparece en el encabezado, inicio de sesión y reportes exportados a Excel.</p>
            </div>
            <span class="badge ${db.customLogo ? 'badge-green' : 'badge-navy'}">
              ${db.customLogo ? 'Logo Personalizado Activo' : 'Logo Predeterminado'}
            </span>
          </div>
          <div class="logo-box">
            ${renderSchoolLogo(64)}
            <div style="flex:1;min-width:200px;">

    function recordAudit(action) {
      const actor = state.currentUser ? `${state.currentUser.name} (${state.currentUser.username})` : 'Sistema';
      db.auditLog.unshift({
        id: `log-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        time: new Date().toLocaleTimeString('es-NI', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        actor,
        action
      });
      if (db.auditLog.length > 150) {
        db.auditLog = db.auditLog.slice(0, 150);
      }
    }

    function saveDatabase(auditMessage = null, showToast = false, options = {}) {
      const skipOnlinePush = Boolean(options && options.skipOnlinePush);
      try {
        if (auditMessage) {
          recordAudit(auditMessage);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        state.lastSavedAt = new Date().toLocaleTimeString('es-NI', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        updateSyncStatusUI();
        if (showToast) {
          notify('Cambios guardados en la base de datos.', 'success');
        }
        if (!skipOnlinePush && db.onlineConfig && db.onlineConfig.enabled) {
          queueAndSyncOnline(auditMessage || 'Actualización de registro');
        }
      } catch (err) {
        notify('No se pudo guardar en el almacenamiento local.', 'error');
      }
    }

    /* ========================================================================
       SINCRONIZACIÓN ONLINE EN TIEMPO REAL (REST / FIREBASE RTDB / FIRESTORE)
       ======================================================================== */
    function buildCloudPayload() {
      return {
        updatedAt: new Date().toISOString(),
        actor: state.currentUser ? state.currentUser.username : 'system',
        year: db.year,
        schoolName: db.schoolName,
        sectionTurnos: db.sectionTurnos,
        users: db.users,
        students: db.students,
        grades: db.grades,
        customLogo: db.customLogo
      };
    }

    function applyCloudPayload(remoteData) {
      if (!remoteData || typeof remoteData !== 'object') return false;
      const candidate = remoteData.fields && remoteData.fields.payloadJson
        ? JSON.parse(remoteData.fields.payloadJson.stringValue)
        : (remoteData.data && typeof remoteData.data === 'object' ? remoteData.data : remoteData);

      if (!candidate || !Array.isArray(candidate.students) || !Array.isArray(candidate.users)) {
        return false;
      }

      db.sectionTurnos = candidate.sectionTurnos || db.sectionTurnos;
      db.users = candidate.users;
      db.students = candidate.students;
      db.grades = candidate.grades && typeof candidate.grades === 'object' ? candidate.grades : {};
      if (typeof candidate.customLogo === 'string' && candidate.customLogo.startsWith('data:image/')) {
        db.customLogo = candidate.customLogo;
      }
      if (state.currentUser) {
        const refreshed = db.users.find((u) => u.id === state.currentUser.id);
        if (refreshed) state.currentUser = refreshed;
        ensureValidSelectedSection();
      }
      return true;
    }

    function resolveTargetUrl() {
      const cfg = db.onlineConfig || {};
      const baseUrl = String(cfg.endpointUrl || '').trim();
      const apiKey = String(cfg.apiKey || '').trim();
      const authToken = String(cfg.authToken || '').trim();
      const docPath = String(cfg.documentPath || 'inggl/2026/database').trim().replace(/^\/+|\/+$/g, '');

      if (!baseUrl) return null;

      if (cfg.mode === 'firebase_rtdb') {
        const cleanBase = baseUrl.replace(/\/+$/, '');
        const rtdbPath = docPath.endsWith('.json') ? docPath : `${docPath}.json`;
        const joiner = rtdbPath.includes('?') ? '&' : '?';
        const authQuery = authToken ? `${joiner}auth=${encodeURIComponent(authToken)}` : '';
        return `${cleanBase}/${rtdbPath}${authQuery}`;
      }

      if (cfg.mode === 'firestore') {
        const cleanBase = baseUrl.replace(/\/+$/, '');
        const docUrl = `${cleanBase}/${docPath}`;
        return apiKey ? `${docUrl}?key=${encodeURIComponent(apiKey)}` : docUrl;
      }

      return baseUrl;
    }

    function buildRequestHeaders() {
      const cfg = db.onlineConfig || {};
      const headers = { 'Content-Type': 'application/json' };
      if (cfg.authToken && cfg.mode === 'rest') {
        headers['Authorization'] = `Bearer ${cfg.authToken}`;
      }
      if (cfg.apiKey && cfg.mode === 'rest') {
        headers['x-api-key'] = cfg.apiKey;
      }
      return headers;
    }

    function formatBodyForMode(payload) {
      const cfg = db.onlineConfig || {};
      if (cfg.mode === 'firestore') {
        return JSON.stringify({
          fields: {
            updatedAt: { stringValue: payload.updatedAt },
            actor: { stringValue: payload.actor },
            payloadJson: { stringValue: JSON.stringify(payload) }
          }
        });
      }
      return JSON.stringify(payload);
    }

    async function pushSingleItemToCloud(item) {
      const url = resolveTargetUrl();
      if (!url) return { ok: false, reason: 'no_endpoint' };
      if (!navigator.onLine) return { ok: false, reason: 'offline' };

      const method = db.onlineConfig.mode === 'firestore' ? 'PATCH' : 'PUT';
      const resp = await fetch(url, {
        method,
        headers: buildRequestHeaders(),
        body: formatBodyForMode(item.payload)
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return { ok: true };
    }

    async function queueAndSyncOnline(summaryText = 'Cambio en línea') {
      const cfg = db.onlineConfig || {};
      if (!cfg.enabled) {
        state.syncStatus = 'offline';
        state.syncDetail = 'Modo nube pausado';
        updateSyncStatusUI();
        return;
      }

      const entry = {
        id: `sync-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        summary: summaryText,
        createdAt: new Date().toISOString(),
        payload: buildCloudPayload()
      };

      db.pendingSyncQueue = [entry];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

      if (!cfg.endpointUrl || !String(cfg.endpointUrl).trim()) {
        state.syncStatus = navigator.onLine ? 'info' : 'offline';
        state.syncDetail = navigator.onLine
          ? 'En línea · Configure URL en Dirección'
          : 'Sin conexión · En cola de reintento';
        updateSyncStatusUI();
        return;
      }

      await flushSyncQueue();
    }

    async function flushSyncQueue(showFeedback = false) {
      const cfg = db.onlineConfig || {};
      if (!cfg.enabled || !cfg.endpointUrl || !String(cfg.endpointUrl).trim()) {
        updateSyncStatusUI();
        return;
      }

      if (!navigator.onLine) {
        state.syncStatus = 'offline';
        state.syncDetail = `Sin señal (${db.pendingSyncQueue.length} en cola)`;
        updateSyncStatusUI();
        return;
      }

      if (state.isSyncing) return;
      state.isSyncing = true;
      state.syncStatus = 'syncing';
      state.syncDetail = 'Sincronizando en línea...';
      updateSyncStatusUI();

      try {
        while (Array.isArray(db.pendingSyncQueue) && db.pendingSyncQueue.length > 0) {
          const currentItem = db.pendingSyncQueue[db.pendingSyncQueue.length - 1];
          const res = await pushSingleItemToCloud(currentItem);
          if (!res.ok) break;
          db.pendingSyncQueue = [];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        state.lastSyncedAt = new Date().toLocaleTimeString('es-NI', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        state.syncStatus = 'online';
        state.syncDetail = `ONLINE · Sincronizado ${state.lastSyncedAt}`;
        updateSyncStatusUI();

        if (showFeedback) {
          notify('Base de datos sincronizada en línea correctamente.', 'success');
        }
      } catch (err) {
        state.syncStatus = 'error';
        state.syncDetail = `Reintentando (${db.pendingSyncQueue.length} en cola)`;
        updateSyncStatusUI();
        if (showFeedback) {
          notify('No se pudo conectar con el servidor en línea. Quedó en cola de reintento.', 'error');
        }
      } finally {
        state.isSyncing = false;
        updateSyncStatusUI();
      }
    }

    async function pullLatestFromCloud(showFeedback = false) {
      const cfg = db.onlineConfig || {};
      const url = resolveTargetUrl();
      if (!cfg.enabled || !url) {
        if (showFeedback) notify('Configure primero la URL del endpoint en Dirección.', 'info');
        return;
      }
      if (!navigator.onLine) {
        if (showFeedback) notify('No hay conexión a internet para descargar cambios.', 'error');
        return;
      }
      if (db.pendingSyncQueue && db.pendingSyncQueue.length > 0) {
        await flushSyncQueue(false);
      }

      try {
        state.syncStatus = 'syncing';
        state.syncDetail = 'Consultando nube...';
        updateSyncStatusUI();

        const resp = await fetch(url, {
          method: 'GET',
          headers: buildRequestHeaders()
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const remoteJson = await resp.json();
        const applied = applyCloudPayload(remoteJson);

        if (applied) {
          recordAudit('Datos actualizados desde la nube en línea');
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          state.lastSyncedAt = new Date().toLocaleTimeString('es-NI', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
          state.syncStatus = 'online';
          state.syncDetail = `ONLINE · Actualizado ${state.lastSyncedAt}`;
          updateSyncStatusUI();
          render();
          if (showFeedback) notify('Cambios en línea descargados y aplicados.', 'success');
        } else {
          state.syncStatus = 'online';
          state.syncDetail = 'ONLINE · Sin datos nuevos';
          updateSyncStatusUI();
          if (showFeedback) notify('Conexión activa; no se encontraron registros nuevos en la nube.', 'info');
        }
      } catch (err) {
        state.syncStatus = 'error';
        state.syncDetail = 'Error al consultar nube';
        updateSyncStatusUI();
        if (showFeedback) notify('Error al obtener datos desde el endpoint en línea.', 'error');
      }
    }

    function updateSyncStatusUI() {
      const dotEl = document.getElementById('syncDotIndicator');
      const labelEl = document.getElementById('syncStatusLabel');
      const queueEl = document.getElementById('syncQueueBadge');
      if (!dotEl || !labelEl) return;

      dotEl.className = 'sync-dot';
      if (!navigator.onLine || state.syncStatus === 'offline') {
        dotEl.classList.add('offline');
        labelEl.textContent = state.syncDetail || 'Sin señal · Cola activa';
      } else if (state.syncStatus === 'syncing') {
        dotEl.classList.add('syncing');
        labelEl.textContent = state.syncDetail || 'Sincronizando...';
      } else if (state.syncStatus === 'error') {
        dotEl.classList.add('error');
        labelEl.textContent = state.syncDetail || 'Reintentando conexión...';
      } else {
        labelEl.textContent = state.syncDetail || `ONLINE · Guardado ${state.lastSavedAt}`;
      }

      if (queueEl) {
        const qLen = Array.isArray(db.pendingSyncQueue) ? db.pendingSyncQueue.length : 0;
        queueEl.textContent = qLen > 0 ? `Cola: ${qLen}` : 'Cola: 0';
      }
    }

    function saveOnlineConfigForm(event) {
      event.preventDefault();
      if (!isAdmin()) return;
      const fd = new FormData(event.target);
      db.onlineConfig = {
        enabled: fd.get('enabled') === 'on',
        mode: String(fd.get('mode') || 'rest'),
        endpointUrl: String(fd.get('endpointUrl') || '').trim(),
        apiKey: String(fd.get('apiKey') || '').trim(),
        authToken: String(fd.get('authToken') || '').trim(),
        documentPath: String(fd.get('documentPath') || 'inggl/2026/database').trim() || 'inggl/2026/database',
        autoPullSeconds: Math.max(5, Number(fd.get('autoPullSeconds') || 15))
      };
      saveDatabase('Configuración de sincronización ONLINE actualizada', true);
      setupAutoPullInterval();
      if (db.onlineConfig.enabled && db.onlineConfig.endpointUrl) {
        flushSyncQueue(true);
      }
    }

    let autoPullTimerId = null;
    function setupAutoPullInterval() {
      if (autoPullTimerId) {
        clearInterval(autoPullTimerId);
        autoPullTimerId = null;
      }
      const sec = Number(db?.onlineConfig?.autoPullSeconds || 15);
      if (db?.onlineConfig?.enabled && db?.onlineConfig?.endpointUrl) {
        autoPullTimerId = setInterval(() => {
          if (navigator.onLine && state.currentUser && (!db.pendingSyncQueue || db.pendingSyncQueue.length === 0)) {
            pullLatestFromCloud(false);
          }
        }, sec * 1000);
      }
    }

    /* ========================================================================
       PERMISOS, TURNOS Y CÁLCULOS ACADÉMICOS
       ======================================================================== */
    function isAdmin() {
      return Boolean(state.currentUser && state.currentUser.role === 'admin');
    }

    function getSectionTurno(sectionName) {
      return db.sectionTurnos[sectionName] || 'Matutino';
    }

    function getAccessibleSections() {
      const allSections = [];
      GRADOS.forEach((g) => SECCIONES.forEach((s) => allSections.push(`${g} ${s}`)));
      if (isAdmin()) return allSections;
      const u = state.currentUser;
      if (!u) return [];
      const set = new Set();
      if (u.guideSection) set.add(u.guideSection);
      db.students.forEach((st) => {
        if (u.turno && u.turno !== 'Todos' && getSectionTurno(st.section) !== u.turno) return;
        set.add(st.section);
      });
      if (set.size === 0) {
        allSections.forEach((sec) => {
          if (!u.turno || u.turno === 'Todos' || getSectionTurno(sec) === u.turno) {
            set.add(sec);
          }
        });
      }
      return Array.from(set);
    }

    function ensureValidSelectedSection() {
      const acc = getAccessibleSections();
      if (acc.length > 0 && !acc.includes(state.selectedSection)) {
        state.selectedSection = acc[0];
      }
    }

    function canEditSubject(subjectId) {
      if (!state.currentUser) return false;
      if (isAdmin()) return true;
      const assigned = state.currentUser.assignedSubjects || [];
      return assigned.includes('*') || assigned.includes(subjectId);
    }

    function isGuideOfSection(sectionName) {
      if (!state.currentUser) return false;
      if (isAdmin()) return true;
      return state.currentUser.guideSection === sectionName;
    }

    function getGradeValue(studentId, periodId, subjectId) {
      return db.grades?.[studentId]?.[periodId]?.[subjectId] ?? '';
    }

    function setGradeValue(studentId, periodId, subjectId, rawValue) {
      if (!db.grades[studentId]) db.grades[studentId] = {};
      if (!db.grades[studentId][periodId]) db.grades[studentId][periodId] = {};
      if (rawValue === '' || rawValue === null || rawValue === undefined) {
        delete db.grades[studentId][periodId][subjectId];
      } else {
        db.grades[studentId][periodId][subjectId] = rawValue;
      }
    }

    function parseNumericGrade(val) {
      if (val === '' || val === null || val === undefined) return null;
      const n = Number(val);
      if (Number.isNaN(n)) return null;
      return Math.max(0, Math.min(100, Math.round(n)));
    }

    function numericToQualitative(score) {
      if (score === null || score === undefined || Number.isNaN(Number(score))) return '';
      const n = Number(score);
      if (n >= 90) return 'AA';
      if (n >= 76) return 'AS';
      if (n >= 60) return 'AF';
      return 'AI';
    }

    function computeSubjectScoreForPeriod(studentId, subjectId, periodId) {
      if (periodId === 'corte1' || periodId === 'corte2' || periodId === 'corte3' || periodId === 'corte4') {
        return parseNumericGrade(getGradeValue(studentId, periodId, subjectId));
      }
      if (periodId === 'semestral1') {
        const c1 = parseNumericGrade(getGradeValue(studentId, 'corte1', subjectId));
        const c2 = parseNumericGrade(getGradeValue(studentId, 'corte2', subjectId));
        if (c1 === null && c2 === null) return null;
        return Math.round(((c1 ?? 0) + (c2 ?? 0)) / ((c1 !== null ? 1 : 0) + (c2 !== null ? 1 : 0)));
      }
      if (periodId === 'semestral2') {
        const c3 = parseNumericGrade(getGradeValue(studentId, 'corte3', subjectId));
        const c4 = parseNumericGrade(getGradeValue(studentId, 'corte4', subjectId));
        if (c3 === null && c4 === null) return null;
        return Math.round(((c3 ?? 0) + (c4 ?? 0)) / ((c3 !== null ? 1 : 0) + (c4 !== null ? 1 : 0)));
      }
      if (periodId === 'anual') {
        const s1 = computeSubjectScoreForPeriod(studentId, subjectId, 'semestral1');
        const s2 = computeSubjectScoreForPeriod(studentId, subjectId, 'semestral2');
        if (s1 === null && s2 === null) return null;
        return Math.round(((s1 ?? 0) + (s2 ?? 0)) / ((s1 !== null ? 1 : 0) + (s2 !== null ? 1 : 0)));
      }
      return null;
    }

    function computeStudentAverageCuan(student, periodId) {
      const curr = getCurriculumForGrade(student.grade);
      const scores = [];
      curr.cuan.forEach((subj) => {
        const sc = computeSubjectScoreForPeriod(student.id, subj.id, periodId);
        if (sc !== null) scores.push(sc);
      });
      if (scores.length === 0) return null;
      const sum = scores.reduce((acc, v) => acc + v, 0);
      return Number((sum / scores.length).toFixed(1));
    }

    function isPeriodEditableDirectly(periodId) {
      return periodId === 'corte1' || periodId === 'corte2' || periodId === 'corte3' || periodId === 'corte4';
    }

    /* ========================================================================
       AUTENTICACIÓN Y GESTIÓN DE USUARIOS / ESTUDIANTES
       ======================================================================== */
    function loginUser(username, password) {
      const cleanUser = String(username || '').trim().toLowerCase();
      const cleanPass = String(password || '').trim();
      const found = db.users.find(
        (u) => u.username.toLowerCase() === cleanUser && String(u.password) === cleanPass
      );
      if (!found) {
        state.loginError = 'Usuario o contraseña incorrectos.';
        render();
        return;
      }
      state.currentUser = found;
      state.loginError = '';
      state.activeTab = 'registro';
      ensureValidSelectedSection();
      recordAudit('Inicio de sesión');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      render();
      if (navigator.onLine && db.onlineConfig && db.onlineConfig.enabled && db.onlineConfig.endpointUrl) {
        pullLatestFromCloud(false);
      }
    }

    function logoutUser() {
      recordAudit('Cierre de sesión');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      state.currentUser = null;
      state.loginError = '';
      render();
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      loginUser(fd.get('username'), fd.get('password'));
    }

    function handleGradeNumberInput(studentId, subjectId, inputEl) {
      if (!isPeriodEditableDirectly(state.selectedPeriod)) return;
      if (!canEditSubject(subjectId)) return;

      let raw = inputEl.value.trim();
      if (raw === '') {
        setGradeValue(studentId, state.selectedPeriod, subjectId, '');
        saveDatabase(`Nota borrada (${subjectId})`, false);
        render();
        return;
      }
      let num = Number(raw);
      if (Number.isNaN(num)) {
        inputEl.value = '';
        return;
      }
      num = Math.max(0, Math.min(100, Math.round(num)));
      inputEl.value = String(num);
      setGradeValue(studentId, state.selectedPeriod, subjectId, num);
      saveDatabase(`Calificación CUAN registrada (${subjectId}: ${num})`, false);
      render();
    }

    function handleGradeQualSelect(studentId, subjectId, selectEl) {
      if (!isPeriodEditableDirectly(state.selectedPeriod)) return;
      if (!canEditSubject(subjectId)) return;
      const val = selectEl.value;
      setGradeValue(studentId, state.selectedPeriod, subjectId, val);
      saveDatabase(`Calificación CUAL registrada (${subjectId}: ${val || 'vacío'})`, false);
      render();
    }

    function addStudentForm(event) {
      event.preventDefault();
      if (!state.currentUser) return;
      const fd = new FormData(event.target);
      const name = String(fd.get('studentName') || '').trim();
      const sex = fd.get('sex') === 'M' ? 'M' : 'F';
      const code = String(fd.get('code') || '').trim();
      const section = String(fd.get('section') || state.selectedSection).trim();
      const grade = section.split(' ')[0] || '7mo';

      if (!isAdmin() && !isGuideOfSection(section)) {
        notify('Solo Dirección o el docente guía de esa sección pueden agregar estudiantes.', 'error');
        return;
      }
      if (!name) {
        notify('Ingrese el nombre completo del estudiante.', 'error');
        return;
      }

      const newStudent = {
        id: `stu-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
        code: code || `2026-${String(db.students.length + 1).padStart(3, '0')}`,
        name,
        sex,
        grade,
        section
      };
      db.students.push(newStudent);
      state.selectedSection = section;
      saveDatabase(`Estudiante agregado: ${name} (${section})`, true);
      event.target.reset();
      render();
    }

    function removeStudent(studentId) {
      if (!state.currentUser) return;
      const stu = db.students.find((s) => s.id === studentId);
      if (!stu) return;
      if (!isAdmin() && !isGuideOfSection(stu.section)) {
        notify('No tiene permiso para eliminar estudiantes de esta sección.', 'error');
        return;
      }
      db.students = db.students.filter((s) => s.id !== studentId);
      delete db.grades[studentId];
      saveDatabase(`Estudiante eliminado: ${stu.name} (${stu.section})`, true);
      render();
    }

    function addTeacherForm(event) {
      event.preventDefault();
      if (!isAdmin()) return;
      const fd = new FormData(event.target);
      const name = String(fd.get('name') || '').trim();
      const username = String(fd.get('username') || '').trim().toLowerCase();
      const password = String(fd.get('password') || '').trim() || '123';
      const turno = String(fd.get('turno') || 'Matutino');
      const guideSection = String(fd.get('guideSection') || '') || null;
      const assignedSubjects = fd.getAll('subjects').map(String);

      if (!name || !username) {
        notify('Complete el nombre y el usuario del docente.', 'error');
        return;
      }
      if (db.users.some((u) => u.username.toLowerCase() === username)) {
        notify('Ese nombre de usuario ya existe.', 'error');
        return;
      }

      db.users.push({
        id: `u-${Date.now()}`,
        name,
        username,
        password,
        role: 'teacher',
        turno,
        guideSection,
        assignedSubjects: assignedSubjects.length > 0 ? assignedSubjects : ['lengua']
      });
      saveDatabase(`Docente creado: ${name} (@${username})`, true);
      event.target.reset();
      render();
    }

    function removeTeacher(userId) {
      if (!isAdmin()) return;
      const target = db.users.find((u) => u.id === userId);
      if (!target || target.role === 'admin') return;
      db.users = db.users.filter((u) => u.id !== userId);
      saveDatabase(`Docente eliminado: ${target.name}`, true);
      render();
    }

    function updateSectionTurno(sectionName, newTurno) {
      if (!isAdmin()) return;
      if (!TURNOS.includes(newTurno)) return;
      db.sectionTurnos[sectionName] = newTurno;
      saveDatabase(`Turno de ${sectionName} cambiado a ${newTurno}`, true);
      render();
    }

    /* ========================================================================
       EXPORTACIÓN A EXCEL (.XLS) Y RESPALDO JSON
       ======================================================================== */
    function exportHtmlTableToExcel(filename, title, subtitle, tableHtml) {
      const logoMarkup = db.customLogo
        ? `<img src="${db.customLogo}" alt="Logo" style="height:54px;width:auto;" />`
        : `<strong>INGGL</strong>`;

      const periodObj = PERIODOS.find((p) => p.id === state.selectedPeriod) || PERIODOS[0];

      let headCells = '<th>#</th><th>Código</th><th>Estudiante</th><th>Sexo</th>';

      curr.cual.forEach((q) => { headCells += `<th>${escapeHtml(q.short)}</th>`; });
      headCells += '<th>Prom. CUAN</th><th>Equiv.</th>';

      const bodyRows = students.map((stu, idx) => {
        const avg = computeStudentAverageCuan(stu, periodObj.id);
        const eq = numericToQualitative(avg);
        let cells = `<td>${idx + 1}</td><td>${escapeHtml(stu.code)}</td><td>${escapeHtml(stu.name)}</td><td>${escapeHtml(stu.sex)}</td>`;

        curr.cual.forEach((q) => {

          cells += `<td>${escapeHtml(v || '')}</td>`;
        });
        cells += `<td><strong>${avg !== null ? avg : ''}</strong></td><td>${escapeHtml(eq)}</td>`;
        return `<tr>${cells}</tr>`;
      }).join('');

      exportHtmlTableToExcel(
        `Consolidado_${section.replace(/\s+/g, '_')}_${turno}_${periodObj.id}.xls`,

    function exportRendimientoExcel() {
      const turno = state.selectedRendTurno;
      const periodObj = PERIODOS.find((p) => p.id === state.selectedRendPeriod) || PERIODOS[0];
      const sectionsInTurno = Object.keys(db.sectionTurnos).filter((sec) => getSectionTurno(sec) === turno);

      const rowsHtml = sectionsInTurno.map((sec) => {
        const stus = db.students.filter((s) => s.section === sec);
        let evalCount = 0;
        let apprCount = 0;
        let failCount = 0;
        let sumAvg = 0;

        stus.forEach((stu) => {
          const avg = computeStudentAverageCuan(stu, periodObj.id);
          if (avg !== null) {
            evalCount++;
            sumAvg += avg;
            if (avg >= 60) apprCount++;
            else failCount++;
          }
        });

        const pct = evalCount > 0 ? `${((apprCount / evalCount) * 100).toFixed(1)}%` : '0.0%';
        const prom = evalCount > 0 ? (sumAvg / evalCount).toFixed(1) : '0.0';
        return `<tr><td>${escapeHtml(sec)}</td><td>${stus.length}</td><td>${evalCount}</td><td>${apprCount}</td><td>${failCount}</td><td>${pct}</td><td>${prom}</td></tr>`;
      }).join('');

      exportHtmlTableToExcel(
        `Rendimiento_Turno_${turno}_${periodObj.id}.xls`,
        `Rendimiento Académico — Turno ${turno}`,
        `Período: ${periodObj.label} · Año Lectivo ${db.year}`,
        `<table><thead><tr><th>Sección</th><th>Matrícula</th><th>Evaluados</th><th>Aprobados</th><th>Reprobados</th><th>% Aprobación</th><th>Promedio</th></tr></thead><tbody>${rowsHtml}</tbody></table>`
      );
    }

    function importDatabaseJson(inputEl) {
      const file = inputEl && inputEl.files && inputEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const parsed = JSON.parse(String(ev.target.result || ''));
          if (!parsed || !Array.isArray(parsed.students) || !Array.isArray(parsed.users)) {
            notify('El archivo JSON no corresponde a la estructura del sistema.', 'error');
            return;
          }
          const defaults = buildInitialDatabase();
          db = {
            ...defaults,
            ...parsed,
            sectionTurnos: parsed.sectionTurnos || defaults.sectionTurnos,
            onlineConfig: { ...defaults.onlineConfig, ...(parsed.onlineConfig || {}) }
          };
          saveDatabase('Respaldo JSON restaurado', true);
          ensureValidSelectedSection();
          render();
        } catch (err) {
          notify('No se pudo leer el archivo JSON.', 'error');
        }
      };
      reader.readAsText(file);
      inputEl.value = '';
    }

            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">Sección</th>
                  <th>Turno</th>
                  <th>Matrícula</th>
                  <th>Aprobados</th>
                  <th>% Aprobación</th>
                  <th>Promedio</th>
                </tr>
              </thead>
              <tbody>${turnoSummaryRows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderRendimientosTab() {
      const turno = state.selectedRendTurno;
      const periodObj = PERIODOS.find((p) => p.id === state.selectedRendPeriod) || PERIODOS[0];
      const sectionsInTurno = Object.keys(db.sectionTurnos).filter((sec) => getSectionTurno(sec) === turno);

      let totalMat = 0;
      let totalEval = 0;
      let totalAppr = 0;
      let sumProms = 0;

      const rows = sectionsInTurno.map((sec) => {
        const stus = db.students.filter((s) => s.section === sec);
        totalMat += stus.length;

        let evalCount = 0;
        let apprCount = 0;
        let failCount = 0;
        let sumAvg = 0;

        stus.forEach((stu) => {
          const avg = computeStudentAverageCuan(stu, periodObj.id);
          if (avg !== null) {
            evalCount++;
            sumAvg += avg;
            if (avg >= 60) apprCount++;
            else failCount++;
          }
        });

        totalEval += evalCount;
        totalAppr += apprCount;
        const pct = evalCount > 0 ? `${((apprCount / evalCount) * 100).toFixed(1)}%` : '0.0%';
        const promNum = evalCount > 0 ? (sumAvg / evalCount) : 0;
        if (evalCount > 0) sumProms += promNum;

        return {
          sec,
          mat: stus.length,
          evalCount,
          apprCount,
          failCount,
          pct,
          prom: evalCount > 0 ? promNum.toFixed(1) : '0.0'
        };
      });

      const generalPct = totalEval > 0 ? `${((totalAppr / totalEval) * 100).toFixed(1)}%` : '0.0%';
      const activeSectionsCount = rows.filter((r) => r.evalCount > 0).length;
      const generalProm = activeSectionsCount > 0 ? (sumProms / activeSectionsCount).toFixed(1) : '0.0';

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">Rendimiento Académico y de Guía — Turno ${escapeHtml(turno)}</h2>
              <p class="card-subtitle">Período: ${escapeHtml(periodObj.label)} · Año Lectivo ${escapeHtml(db.year)}</p>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <select class="select-sm" style="width:auto;" onchange="state.selectedRendTurno = this.value; render();">
                <option value="Matutino" ${turno === 'Matutino' ? 'selected' : ''}>Turno Matutino</option>
                <option value="Vespertino" ${turno === 'Vespertino' ? 'selected' : ''}>Turno Vespertino</option>
              </select>
              <select class="select-sm" style="width:auto;" onchange="state.selectedRendPeriod = this.value; render();">
                ${PERIODOS.map((p) => `<option value="${p.id}" ${p.id === state.selectedRendPeriod ? 'selected' : ''}>${escapeHtml(p.label)}</option>`).join('')}
              </select>
              <button type="button" class="btn btn-success btn-sm" onclick="exportRendimientoExcel()">Exportar Rendimiento (.xls)</button>
            </div>
          </div>

          <div class="grid-4" style="margin-bottom:14px;">
            <div class="kpi-card">
              <div class="kpi-label">Matrícula (${escapeHtml(turno)})</div>
              <div class="kpi-value">${totalMat}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Aprobados</div>
              <div class="kpi-value">${totalAppr}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">% Aprobación</div>
              <div class="kpi-value">${generalPct}</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">Promedio Turno</div>
              <div class="kpi-value">${generalProm}</div>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">Sección</th>
                  <th>Matrícula</th>
                  <th>Evaluados</th>
                  <th>Aprobados</th>
                  <th>Reprobados</th>
                  <th>% Aprobación</th>
                  <th>Promedio</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td class="left" style="font-weight:700;">${escapeHtml(r.sec)}</td>
                    <td>${r.mat}</td>
                    <td>${r.evalCount}</td>
                    <td><span class="badge badge-green">${r.apprCount}</span></td>
                    <td><span class="badge ${r.failCount > 0 ? 'badge-red' : 'badge-navy'}">${r.failCount}</span></td>
                    <td style="font-weight:700;">${r.pct}</td>
                    <td style="font-weight:800;">${r.prom}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderDocentesTab() {
      if (!isAdmin()) {
        return `<div class="card"><p class="muted-note">Esta sección es exclusiva de Dirección.</p></div>`;
      }

      const allSections = [];
      GRADOS.forEach((g) => SECCIONES.forEach((s) => allSections.push(`${g} ${s}`)));

      const allSubjectChoices = [
        { id: '*', label: 'Todas las Asignaturas' },
        ...CUAN_10_11.map((c) => ({ id: c.id, label: c.name })),
        { id: 'ccnn', label: 'Ciencias Naturales' },
        { id: 'est_soc', label: 'Estudios Sociales' },
        { id: 'tac', label: 'Taller de Arte y Cultura (TAC)' },
        ...CUAL_SUBJECTS.map((q) => ({ id: q.id, label: q.name }))
      ];

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">Asignación de Turnos (Matutino y Vespertino)</h2>
              <p class="card-subtitle">Define qué turno corresponde a cada sección de 7mo a 11mo grado.</p>
            </div>
          </div>
          <div class="grid-3">
            ${allSections.map((sec) => {
              const currentT = getSectionTurno(sec);
              return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--bg-subtle);">
                  <strong style="font-size:13px;">${escapeHtml(sec)}</strong>
                  <select class="select-sm" style="width:auto;" onchange="updateSectionTurno('${escapeHtml(sec)}', this.value)">
                    <option value="Matutino" ${currentT === 'Matutino' ? 'selected' : ''}>Matutino</option>
                    <option value="Vespertino" ${currentT === 'Vespertino' ? 'selected' : ''}>Vespertino</option>
                  </select>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">Crear Cuenta de Docente</h2>
              <p class="card-subtitle">Asigna turno, sección guía y asignaturas para cada maestro.</p>
            </div>
          </div>
          <form onsubmit="addTeacherForm(event)">
            <div class="grid-3">
              <div class="form-group">
                <label class="form-label">Nombre Completo</label>
                <input type="text" name="name" class="form-control" required placeholder="Ej. Prof. Marta Ruiz" />
              </div>
              <div class="form-group">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required placeholder="Ej. mruiz" />
              </div>
              <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="text" name="password" class="form-control" value="123" required />
              </div>
              <div class="form-group">
                <label class="form-label">Turno</label>
                <select name="turno" class="form-control">
                  <option value="Matutino">Matutino</option>
                  <option value="Vespertino">Vespertino</option>
                  <option value="Todos">Ambos Turnos</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Sección Guía (opcional)</label>
                <select name="guideSection" class="form-control">
                  <option value="">Ninguna</option>
                  ${allSections.map((sec) => `<option value="${escapeHtml(sec)}">${escapeHtml(sec)} (${getSectionTurno(sec)})</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="form-group" style="margin-top:10px;">
              <label class="form-label">Asignaturas Permitidas</label>
              <div style="display:flex;flex-wrap:wrap;gap:10px;padding:10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--bg-subtle);">
                ${allSubjectChoices.map((ch) => `
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;cursor:pointer;">
                    <input type="checkbox" name="subjects" value="${escapeHtml(ch.id)}" ${ch.id === 'lengua' ? 'checked' : ''} />
                    ${escapeHtml(ch.label)}
                  </label>
                `).join('')}
              </div>
            </div>

            <div style="margin-top:12px;display:flex;justify-content:flex-end;">
              <button type="submit" class="btn btn-primary">Registrar Docente</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Usuarios Registrados</h3>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th class="left">Nombre</th>
                  <th>Usuario</th>
                  <th>Rol</th>
                  <th>Turno</th>
                  <th>Sección Guía</th>
                  <th>Asignaturas</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                ${db.users.map((u) => `
                  <tr>
                    <td class="left" style="font-weight:700;">${escapeHtml(u.name)}</td>
                    <td><code>${escapeHtml(u.username)}</code></td>
                    <td>${u.role === 'admin' ? '<span class="badge badge-navy">Dirección</span>' : '<span class="badge badge-green">Docente</span>'}</td>
                    <td>${escapeHtml(u.turno || 'Todos')}</td>
                    <td>${u.guideSection ? escapeHtml(u.guideSection) : '—'}</td>
                    <td>${escapeHtml((u.assignedSubjects || []).join(', '))}</td>
                    <td>
                      ${u.role === 'admin'
                        ? '—'
                        : `<button type="button" class="btn btn-danger btn-sm" onclick="removeTeacher('${u.id}')">Eliminar</button>`}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Sincronización ONLINE en Tiempo Real</h3>
              <p class="card-subtitle">Conecta tu URL de API REST / Webhook o Firebase para sincronizar cambios en línea.</p>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="pullLatestFromCloud(true)">Descargar Nube</button>
              <button type="button" class="btn btn-success btn-sm" onclick="flushSyncQueue(true)">Sincronizar Ahora</button>
            </div>
          </div>
          <form onsubmit="saveOnlineConfigForm(event)">
            <div class="grid-3">
              <div class="form-group">
                <label class="form-label">Modo Online</label>
                <select name="mode" class="form-control">
                  <option value="rest" ${db.onlineConfig.mode === 'rest' ? 'selected' : ''}>API REST / Webhook JSON (PUT)</option>
                  <option value="firebase_rtdb" ${db.onlineConfig.mode === 'firebase_rtdb' ? 'selected' : ''}>Firebase Realtime Database</option>
                  <option value="firestore" ${db.onlineConfig.mode === 'firestore' ? 'selected' : ''}>Google Firestore REST</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">URL Base / Endpoint Online</label>
                <input type="url" name="endpointUrl" class="form-control" value="${escapeHtml(db.onlineConfig.endpointUrl)}" placeholder="https://..." />
              </div>
              <div class="form-group">
                <label class="form-label">Ruta / Documento</label>
                <input type="text" name="documentPath" class="form-control" value="${escapeHtml(db.onlineConfig.documentPath)}" placeholder="inggl/2026/database" />
              </div>
              <div class="form-group">
                <label class="form-label">Token / Clave (opcional)</label>
                <input type="password" name="authToken" class="form-control" value="${escapeHtml(db.onlineConfig.authToken)}" />
              </div>
              <div class="form-group">
                <label class="form-label">API Key (opcional)</label>
                <input type="text" name="apiKey" class="form-control" value="${escapeHtml(db.onlineConfig.apiKey)}" />
              </div>
              <div class="form-group">
                <label class="form-label">Intervalo Consulta (seg.)</label>
                <input type="number" min="5" max="120" name="autoPullSeconds" class="form-control" value="${escapeHtml(db.onlineConfig.autoPullSeconds)}" />
              </div>
            </div>
            <div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;">
              <label style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;cursor:pointer;">
                <input type="checkbox" name="enabled" ${db.onlineConfig.enabled ? 'checked' : ''} />
                Sincronización ONLINE automática al guardar y al conectar
              </label>
              <button type="submit" class="btn btn-primary">Guardar Configuración Online</button>
            </div>
          </form>
        </div>

        ${renderLogoManagerCard()}
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      if (!state.currentUser) {
        app.innerHTML = renderLoginView();
        return;
      }

      const tabs = [
        { id: 'registro', label: 'Registro de Notas' },
        { id: 'consolidado', label: 'Consolidados y Turnos' },
        { id: 'rendimientos', label: 'Rendimiento de Guía' }
      ];
      if (isAdmin()) {
        tabs.push({ id: 'docentes', label: 'Docentes, Turnos y Nube' });
      }

      let bodyHtml = '';
      if (state.activeTab === 'consolidado') {
        bodyHtml = renderConsolidadoTab();
      } else if (state.activeTab === 'rendimientos') {
        bodyHtml = renderRendimientosTab();
      } else if (state.activeTab === 'docentes' && isAdmin()) {
        bodyHtml = renderDocentesTab();
      } else {
        state.activeTab = 'registro';
        bodyHtml = renderRegistroTab();
      }

      const recentLogs = (db.auditLog || []).slice(0, 6);

      app.innerHTML = `
        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand-group">
              ${renderSchoolLogo(46)}
              <div>
                <h1 class="brand-title">${escapeHtml(db.schoolName)}</h1>
                <p class="brand-sub">${escapeHtml(db.schoolLocation)} • ${escapeHtml(db.motto)}</p>
              </div>
            </div>
            <div class="topbar-actions">
              <span class="user-pill">
                <span id="syncDotIndicator" class="sync-dot"></span>
                <span id="syncStatusLabel">${escapeHtml(state.syncDetail)}</span>
              </span>
              <span class="user-pill" id="syncQueueBadge">
                Cola: ${(db.pendingSyncQueue || []).length}
              </span>
              <span class="user-pill">
                Guardado (${escapeHtml(state.lastSavedAt)})
              </span>
              <button type="button" class="btn btn-success btn-sm" onclick="saveDatabase('Guardado manual ejecutado', true)">
                Guardar
              </button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="exportDatabaseJson()">
                Respaldar JSON
              </button>
              <label class="btn btn-secondary btn-sm" style="margin:0;cursor:pointer;">
                Restaurar JSON
                <input type="file" accept=".json,application/json" style="display:none;" onchange="importDatabaseJson(this)" />
              </label>
              <span class="user-pill">
                ${escapeHtml(state.currentUser.name)} (${isAdmin() ? 'Dirección' : 'Docente'})
              </span>
              <button type="button" class="btn btn-secondary btn-sm" onclick="logoutUser()">Cerrar Sesión</button>
            </div>
          </div>
        </header>

        <main class="main-container">
          <nav class="tabs-bar" aria-label="Secciones del sistema">
            ${tabs.map((t) => `
              <button
                type="button"
                class="tab-btn ${state.activeTab === t.id ? 'active' : ''}"
                onclick="state.activeTab = '${t.id}'; render();"
              >
                ${escapeHtml(t.label)}
              </button>
            `).join('')}
          </nav>

          ${bodyHtml}

          <div class="card" style="margin-top:16px;">
            <div class="card-header" style="margin-bottom:8px;padding-bottom:8px;">
              <div>
                <h3 class="card-title" style="font-size:14px;">Bitácora de Actividad</h3>
                <p class="card-subtitle">Registro de cambios y sincronización en el sistema.</p>
              </div>
              <span class="badge badge-green">Autoguardado Activo</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-muted);">
              ${recentLogs.map((item) => `
                <div><strong>[${escapeHtml(item.time)}]</strong> <span>${escapeHtml(item.actor)}:</span> ${escapeHtml(item.action)}</div>
              `).join('')}
            </div>
          </div>
        </main>
      `;
      updateSyncStatusUI();
    }

    window.addEventListener('online', () => {
      state.syncStatus = 'online';
      state.syncDetail = 'ONLINE · Conexión restaurada';
      updateSyncStatusUI();
      flushSyncQueue(true);
    });

    window.addEventListener('offline', () => {
      state.syncStatus = 'offline';
      state.syncDetail = 'Sin señal · En cola de reintento';
      updateSyncStatusUI();
    });

    document.addEventListener('DOMContentLoaded', () => {
      render();
      setupAutoPullInterval();
      if (navigator.onLine && db.onlineConfig && db.onlineConfig.enabled && db.onlineConfig.endpointUrl) {
        flushSyncQueue(false);
      }
    });
  </script>
</body>
</html>
